# Fixed diagnostic demo goals and public parameters; these are not solver actions.
# Scene paths are relative to the AA1 root. Use the matching generated driver/model.
robots:
  so101:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then set the gripper opening to 20% of its full opening and set it
      to 80%, using at most 2 seconds for each change.
    scene: assets/mjcf/demo_scenes/so101/fixed_scene.xml
    initial_state:
      robot:
        qpos_by_joint:
          shoulder_pan: 0.0
          shoulder_lift: 0.0
          elbow_flex: 0.0
          wrist_flex: 0.0
          wrist_roll: 0.0
          jaw_visual_joint: -0.175
      settle_s: 0.5
      ctrl_by_actuator:
        act_shoulder_pan: 0.0
        act_shoulder_lift: 0.0
        act_elbow_flex: 0.0
        act_wrist_flex: 0.0
        act_wrist_roll: 0.0
        act_jaw_visual: -0.175
    parameters:
      waypoints_world_m: [[0.4, 0.02, 0.24], [0.405, 0.03, 0.238]]
      max_duration_per_segment_s: 3.0
      closed_opening_fraction: 0.2
      open_opening_fraction: 0.8
      max_gripper_duration_s: 2.0
  piper:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then set the gripper opening to 20% of its full opening and set it
      to 80%, using at most 2 seconds for each change.
    scene: assets/mjcf/demo_scenes/piper/fixed_scene.xml
    initial_state:
      robot:
        keyframe: home
      settle_s: 0.5
    parameters:
      waypoints_world_m: [[0.5278726066989874, 0.0014136382917729296, 0.2932552441045567], [0.5397902112858992,
          0.001413369142007601, 0.2505259409261455]]
      max_duration_per_segment_s: 3.0
      closed_opening_fraction: 0.2
      open_opening_fraction: 0.8
      max_gripper_duration_s: 2.0
  franka:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then set the gripper opening to 20% of its full opening and set it
      to 80%, using at most 2 seconds for each change.
    scene: assets/mjcf/demo_scenes/franka/fixed_scene.xml
    initial_state:
      robot:
        keyframe: home
      settle_s: 0.5
    parameters:
      waypoints_world_m: [[0.5748202967087088, -1.018587730189481e-17, 0.4383206727855534], [0.5813985219109039,
          6.987254145608034e-18, 0.39204723824283383]]
      max_duration_per_segment_s: 3.0
      closed_opening_fraction: 0.2
      open_opening_fraction: 0.8
