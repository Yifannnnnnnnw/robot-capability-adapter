  kuka_iiwa14:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then move 2 centimetres
      along the robot-base positive X direction and return to that motion's starting position, using
      at most 3 seconds per leg.
    scene: assets/mjcf/demo_scenes/kuka_iiwa14/fixed_scene.xml
    initial_state:
      robot:
        keyframe: home
      settle_s: 0.5
    parameters:
      waypoints_world_m: [[0.6519175340259213, 1.3918228253195858e-17, 0.1924353681094415], [0.6364416340080432,
          5.210352354021968e-18, 0.14087349879070193]]
      max_duration_per_segment_s: 3.0
      offset_robot_base_m: [0.02, 0.0, 0.0]
      max_duration_per_leg_s: 3.0
  kinova_gen3_robotiq_2f85:
