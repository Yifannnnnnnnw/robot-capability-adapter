  universal_robots_ur5e_robotiq_2f85:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then set the gripper opening to 20% of its full opening and set it
      to 80%, using at most 2 seconds for each change.
    scene: assets/mjcf/demo_scenes/universal_robots_ur5e_robotiq_2f85/fixed_scene.xml
    initial_state:
      robot:
        keyframe: home
      settle_s: 0.5
    parameters:
      waypoints_world_m: [[-0.13399740197579427, 0.451491054171059, 0.26604776837560373], [-0.13399750178676234,
