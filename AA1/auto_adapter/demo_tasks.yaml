      max_duration_per_segment_s: 3.0
      closed_opening_fraction: 0.2
      open_opening_fraction: 0.8
      max_gripper_duration_s: 2.0
  go2:
    task: >-
      Hold a stable stance for 1.2 seconds. Move forward 10 centimetres along the initial heading
      without changing heading, using at most 5 seconds. Hold a stable stance for another 1.2 seconds.
      Crouch to a body height of 0.26 metres, then rise to 0.32 metres and hold a stable stance for
      1.2 seconds. Use at most 3 seconds for each height change; remain upright throughout.
    scene: assets/mjcf/go2/go2_scene.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        base_link:
          position_m: [0.0, 0.0, 0.27]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      initial_stand_s: 1.2
      translation_initial_yaw_m: [0.1, 0.0]
      yaw_delta_rad: 0.0
      max_walk_duration_s: 5.0
      post_walk_stand_s: 1.2
      crouch_height_m: 0.26
      standing_height_m: 0.32
      max_height_change_duration_s: 3.0
      final_stand_s: 1.2
  unitree_a1:
    task: >-
      Hold a stable stance for 1.2 seconds. Move forward 10 centimetres along the initial heading
      without changing heading, using at most 5 seconds. Hold a stable stance for another 1.2 seconds.
      Crouch to a body height of 0.23 metres, then rise to 0.26 metres and hold a stable stance for
      1.2 seconds. Use at most 3 seconds for each height change; remain upright throughout.
    scene: assets/mjcf/demo_scenes/unitree_a1/fixed_scene.xml
    initial_state:
      robot:
        keyframe: fixed_settled
      free_bodies:
        trunk:
          position_m: [-0.009287943329024754, 0.0001620980901417257, 0.2608028758756205]
          quaternion_wxyz: [0.9999976858294743, -0.0004624525165845869, -0.0020995356178032444, 8.01470826695388e-05]
    parameters:
      initial_stand_s: 1.2
      translation_initial_yaw_m: [0.1, 0.0]
      yaw_delta_rad: 0.0
      max_walk_duration_s: 5.0
      post_walk_stand_s: 1.2
      crouch_height_m: 0.23
      standing_height_m: 0.26
      max_height_change_duration_s: 3.0
      final_stand_s: 1.2
  anymal_c:
    task: >-
      Hold a stable stance for 1.2 seconds. Move forward 10 centimetres along the initial heading
      without changing heading, using at most 5 seconds. Hold a stable stance for another 1.2 seconds.
      Crouch to a body height of 0.34 metres, then rise to 0.374 metres and hold a stable stance for
      1.2 seconds. Use at most 3 seconds for each height change; remain upright throughout.
    scene: assets/mjcf/demo_scenes/anymal_c/fixed_scene.xml
    initial_state:
      robot:
        keyframe: fixed_settled
      free_bodies:
        base:
          position_m: [-6.457461251270239e-05, -4.0079877731544627e-08, 0.3737473812630869]
          quaternion_wxyz: [0.9999999224697815, 3.496239916988932e-08, 0.00039376895540493183, 2.5372932878103854e-06]
    parameters:
      initial_stand_s: 1.2
      translation_initial_yaw_m: [0.1, 0.0]
      yaw_delta_rad: 0.0
      max_walk_duration_s: 5.0
      post_walk_stand_s: 1.2
      crouch_height_m: 0.34
      standing_height_m: 0.374
      max_height_change_duration_s: 3.0
      final_stand_s: 1.2
  leap_hand:
    task: >-
      Observe and remember the initial world-frame positions of all four fingertips. Move them to
      the four specified fingertip targets within 2 seconds, then return them to their observed initial
      positions within 2 seconds. Keep the palm fixed.
    scene: assets/mjcf/leap_hand/scene_right.xml
    initial_state: {}
    parameters:
      fingertip_targets_world_m:
        index: [0.07335660802168197, -0.00035632549311595194, 0.19640134016148583]
        middle: [0.0816667783168793, 0.03052030123777584, 0.190066559632383]
        ring: [0.08921244503978432, 0.0755951492628891, 0.18266184109195774]
        thumb: [-0.04099581270947017, -0.09376306126879147, 0.17724107124754265]
      max_duration_per_motion_s: 2.0
  hello_robot_stretch_2:
    task: >-
      Drive the base forward 10 centimetres at 0.1 metres per second, completing the move within 5
      seconds. Then move the end effector to world position (-0.02, -0.24, 0.67) metres within 2 seconds
      while keeping the base position fixed.
    scene: assets/mjcf/hello_robot_stretch_2/scene.xml
    initial_state: {}
    parameters:
      forward_distance_m: 0.1
      drive_speed_m_s: 0.1
      max_drive_duration_s: 5.0
      end_effector_target_world_m: [-0.02, -0.24, 0.67]
      max_reach_duration_s: 2.0
  aloha_2:
    task: >-
      Move the left end effector to its specified world-frame target, then move the right end effector
      to its specified world-frame target, using at most 2 seconds for each arm. Keep the other arm
      in place during each move, then hold both target positions together for 0.5 seconds.
    scene: assets/mjcf/aloha_2/scene.xml
    initial_state:
      robot:
        keyframe: neutral_pose
    parameters:
      left_target_world_m: [-0.178291, 0.004306, 0.326503]
      right_target_world_m: [0.178291, -0.042306, 0.326503]
      max_duration_per_arm_s: 2.0
      hold_duration_s: 0.5
  skydio_x2:
    task: >-
      Take off to a world-frame altitude of 0.5 metres within 8 seconds, then hover in place for 2
      seconds. Stay upright and maintain the target altitude during the hover.
    scene: assets/mjcf/skydio_x2/scene.xml
    initial_state: {}
    parameters:
      target_altitude_world_m: 0.5
      max_takeoff_duration_s: 8.0
      hover_duration_s: 2.0
  h1:
    task: >-
      Stand upright and balanced for 2 seconds. Lower the torso by 0.15 metres and recover the standing
      height over 3 seconds, then stand balanced for another 2 seconds. Remain upright throughout.
    scene: assets/mjcf/h1/scene.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        pelvis:
          position_m: [0.0, 0.0, 0.98]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      initial_stand_s: 2.0
      squat_depth_m: 0.15
      squat_and_recovery_duration_s: 3.0
      final_stand_s: 2.0
  menagerie_so101:
    task: >-
      Move the `gripperframe` site through the two nearby world-frame waypoints in order. Then set
      the `gripper` joint to -0.08 radians and to 0.16 radians, using at most 2 seconds for each
      change.
    scene: assets/mjcf/robotstudio_so101/scene.xml
    initial_state:
      robot:
        qpos_by_joint:
          shoulder_pan: 0.0
          shoulder_lift: 0.0
          elbow_flex: 0.0
          wrist_flex: 0.0
          wrist_roll: 0.0
          gripper: 0.0
    parameters:
      waypoints_world_m: [[0.396, -0.001, 0.248], [0.388, 0.004, 0.242]]
      gripper_joint_targets_rad: [-0.08, 0.16]
      max_duration_per_segment_s: 2.0
      max_gripper_duration_s: 2.0
  so101_push:
    task: >-
      In the push scene, place the `ee_site` fingertip at the `tee` body and make a short positive-X
      push from the listed initial object pose, then withdraw to the listed clearance waypoint.
      Keep the fixed `obs` body out of the motion.
    scene: assets/mjcf/pushbench/so101_pushbench.xml
    initial_state:
      robot:
        qpos_by_joint:
          shoulder_pan: 0.0
          shoulder_lift: 0.0
          elbow_flex: 0.0
          wrist_flex: 0.0
          wrist_roll: 0.0
          jaw_visual_joint: 0.0
      free_bodies:
        tee:
          position_m: [0.18, -0.05, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_red:
          position_m: [0.1, 0.1, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_green:
          position_m: [0.18, 0.12, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_blue:
          position_m: [0.14, 0.18, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      pushed_body: tee
      object_initial_position_world_m: [0.18, -0.05, 0.025]
      push_delta_world_m: [0.04, 0.0, 0.0]
      clearance_waypoint_world_m: [0.30, -0.05, 0.08]
      max_duration_s: 3.0
  piper_push:
    task: >-
      In the Piper push scene, move the `ee_site` to the `tee` body and make a short positive-X
      contact motion, then return the arm to its `home` joint configuration. Leave the three cubes
      in their listed scene positions.
    scene: assets/mjcf/piper/pushbench.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        tee:
          position_m: [0.35, -0.05, 0.205]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_red:
          position_m: [0.35, 0.1, 0.205]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_green:
          position_m: [0.45, 0.12, 0.205]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_blue:
          position_m: [0.4, 0.15, 0.205]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      pushed_body: tee
      object_initial_position_world_m: [0.35, -0.05, 0.205]
      push_delta_world_m: [0.04, 0.0, 0.0]
      max_duration_s: 3.0
  franka_push:
    task: >-
      In the Franka push scene, move the `hand` body into a short positive-X contact motion with
      the `tee` body, then return the seven arm joints to their `home` values. Leave the three cubes
      and fixed `obs` body in their listed scene positions.
    scene: assets/mjcf/franka_panda/pushbench.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        tee:
          position_m: [0.45, -0.05, 0.425]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_red:
          position_m: [0.45, 0.1, 0.425]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_green:
          position_m: [0.55, 0.12, 0.425]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_blue:
          position_m: [0.5, 0.15, 0.425]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      pushed_body: tee
      object_initial_position_world_m: [0.45, -0.05, 0.425]
      push_delta_world_m: [0.04, 0.0, 0.0]
      max_duration_s: 3.0
  ur5e:
    task: >-
      Use the bare UR5e arm's `attachment_site` as the end-effector reference. Starting from the
      `home` keyframe, move the six named arm joints to the listed bounded configuration and return
      to `home`, using at most 2 seconds for each leg.
    scene: assets/mjcf/universal_robots_ur5e/scene.xml
    initial_state:
      robot:
        keyframe: home
    parameters:
      target_joint_positions_rad:
        shoulder_pan_joint: -1.5
        shoulder_lift_joint: -1.45
        elbow_joint: 1.45
        wrist_1_joint: -1.45
        wrist_2_joint: -1.55
        wrist_3_joint: 0.1
      max_duration_per_leg_s: 2.0
  unitree_g1:
    task: >-
      From the `stand` keyframe, move the left and right elbow joints to the listed nearby targets
      in order, then restore their stand values. Keep the `pelvis` floating body at its initialized
      pose.
    scene: assets/mjcf/unitree_g1/scene.xml
    initial_state:
      robot:
        keyframe: stand
      free_bodies:
        pelvis:
          position_m: [0.0, 0.0, 0.79]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      joint_targets_rad:
        left_elbow_joint: 1.18
        right_elbow_joint: 1.38
      max_duration_per_joint_s: 2.0
  google_barkour_vb:
    task: >-
      From the `home` keyframe, move the four knee joints to the listed nearby targets in
      front-left, hind-left, front-right, hind-right order, then restore their home values. Keep
      the `torso` floating body at its initialized pose.
    scene: assets/mjcf/google_barkour_vb/scene.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        torso:
          position_m: [0.0, 0.0, 0.28]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      knee_joint_order:
        - knee_front_left
        - knee_hind_left
        - knee_front_right
        - knee_hind_right
      knee_targets_rad:
        knee_front_left: 0.9
        knee_hind_left: 1.1
        knee_front_right: 0.9
        knee_hind_right: 1.1
      max_duration_per_joint_s: 1.0
