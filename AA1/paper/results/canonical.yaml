# Canonical results — single source of truth for all paper sections.
#
# Every number in the paper draft references a (cell_id, value, source_json,
# n_episodes, seed, deterministic) tuple from this file. If you need to
# change a number, change it here and re-grep papers/*.md for the cell_id.
#
# Generated 2026-05-31 from raw JSONs in autoadapter_bench/baselines/.
# Provenance: paper/results/build_canonical.py (recomputes from JSONs)

version: "1.0"
generated_at: "2026-05-31"
robot: "SO-101 (5-DoF arm + 1-DoF gripper)"
driver_artifact:
  spec_instantiated_path: "artifacts/auto_adapter_so101_v2_artifacts/"
  self_contained_path: "artifacts/auto_adapter_from_scratch_so101_artifacts/"
