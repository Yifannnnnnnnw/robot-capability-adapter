    - autoadapter_bench/results/cap_so101_hard_sonnet45_n5.json
    - autoadapter_bench/results/cap_so101_hard_sonnet46_n5.json
    - autoadapter_bench/results/cap_so101_hard_haiku45_n5.json
  results:
    # llm_self = % trials where LLM reports success (regardless of phys).
    # Cost = Bedrock token cost at $3/M in, $15/M out (Sonnet) or
    # $1/M in, $5/M out (Haiku).
    ours_haiku45:   { physics: 0.75, llm_self: 1.00, cost_usd: 0.58, wall_s: 451 }
    ours_sonnet45:  { physics: 0.75, llm_self: 1.00, cost_usd: 1.82, wall_s: 687 }
    ours_sonnet46:  { physics: 0.75, llm_self: 1.00, cost_usd: 2.16, wall_s: 896 }
    cap_haiku45:    { physics: 0.55, llm_self: 0.50, cost_usd: 0.06, wall_s: 192 }
    cap_sonnet45:   { physics: 0.70, llm_self: 0.75, cost_usd: 0.13, wall_s: 251 }
    cap_sonnet46:   { physics: 0.75, llm_self: 0.75, cost_usd: 0.14, wall_s: 266 }
  finding: |
    Ours is model-insensitive: 75% physics across all 3 models. CaP
    is model-sensitive: 55% / 70% / 75% physics for Haiku/Sonnet4.5/
    Sonnet4.6. CaP with Sonnet 4.6 ($0.14) matches ours+Haiku 4.5
    ($0.58) on physics at ~4x lower cost. The persistent gap is
    per-trial LLM-self↔physics agreement: ours 100% across models,
    CaP 50-75%. The semantically clean across-robot signal is
    exp8's over_claim_count (CaP doubles ours, 6/15 vs 3/15).
  changelog_n2_to_n5: |
    CaP × Sonnet 4.5 moved from 50% (N=2) to 70% (N=5);
    CaP × Haiku 4.5 moved from 62% to 55%; ours stable at 75%
    across all 3 models in both samplings.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 8: 3rd-robot simple suite validation (§4.6)
# Piper + UR5e × ours/cap, 5 tasks × 3 trials = 15 trials per config
# Source: autoadapter_bench/results/{ours,cap}_{piper,ur5e}_simple_sonnet45.json
# ─────────────────────────────────────────────────────────────────────────
exp8_cross_robot_simple:
  description: |
    Replicate the simple arm suite on Piper (6-DoF) and UR5e (6-DoF)
    using their agent-synthesized drivers from §4.1. Establishes that
    the §4.2 result is not single-robot artifact.
  n_tasks: 5
  n_trials_per_task: 3
  tasks: [move_x_plus_5cm, move_z_plus_5cm, trace_square_xy, gripper_cycle, unreachable_detect]
  model: Claude Sonnet 4.5
  results:
    # llm_self = % trials where the LLM-reported success (both methods
    # always claim success, so this is uniformly 100% — kept here only
    # to show the lifted gap is in agreement).
    # agreement = % trials where LLM-report and physics-outcome match.
    # over_claim_count = trials where phys=fail but LLM=ok (per-15-trial).
    ours_piper:   { physics: 0.80, llm_self: 1.00, agreement: 0.80, over_claim_count: 3, wall_s: 229 }
    cap_piper:    { physics: 0.60, llm_self: 1.00, agreement: 0.60, over_claim_count: 6, wall_s:  90 }
    ours_ur5e:    { physics: 0.80, llm_self: 1.00, agreement: 0.80, over_claim_count: 3, wall_s: 240 }
    cap_ur5e:     { physics: 0.60, llm_self: 1.00, agreement: 0.60, over_claim_count: 6, wall_s: 110 }
  per_task_breakdown_piper_and_ur5e_identical:
    move_x_plus_5cm:      { ours: "3/3", cap: "3/3" }
    move_z_plus_5cm:      { ours: "3/3", cap: "3/3" }
    trace_square_xy:      { ours: "0/3", cap: "0/3" }   # driver IK on multi-waypoint
    gripper_cycle:        { ours: "3/3", cap: "3/3" }
    unreachable_detect:   { ours: "3/3", cap: "0/3" }   # ReAct catches the IK exception
  finding: |
    Both methods solve basic reach + gripper on Piper and UR5e. The
    differentiator on the simple suite is `unreachable_detect`: CaP
    reports completion (LLM=ok) despite move_cartesian raising
    IKUnreachableError (phys=fail), creating 3 phys=fail/LLM=ok trials
    per robot; the ReAct loop catches the exception, returns home,
    and reports honestly so phys and LLM agree. Over-claim rate doubles
    for CaP (6/15 vs 3/15). trace_square_xy fails on both methods on
    both robots because the synthesized 6/7-DoF arm IK accumulates
    residual over a multi-waypoint trajectory — both methods
    misattribute completion to having issued the right tool calls.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 9: Piper cross-skill Reach + Pick (§4.6.2)
# Pickbench scene with 3 graspable cubes; 6 tasks × 5 trials = 30 trials
# Source: autoadapter_bench/baselines/llm_piper_pick.json
# ─────────────────────────────────────────────────────────────────────────
exp9_piper_cross_skill_pick:
  description: |
    Cross-skill Reach + Pick on Piper using a from-scratch driver
    SYNTHESIZED AGAINST THE PICKBENCH MJCF (grasp logic included).
    Demonstrates §4.1's synthesis pipeline scales to scenes with
    graspable bodies and produces a working pick-capable driver
    end-to-end on a 3rd robot.
  workspace: artifacts/from_scratch_piper_pickbench/
  scene: assets/mjcf/piper/pickbench.xml
  source_json: autoadapter_bench/baselines/llm_piper_pick_v2.json
  agent_model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  synthesis:
    duration_sec: 503.7
    cost_usd: 3.52
    structural_validation: passed
  eval:
    n_tasks: 6
    n_trials_per_task: 5
    n_trials_total: 30
    results:
      reach_red:   { n_success: 5, n_total: 5 }
      reach_green: { n_success: 5, n_total: 5 }
      reach_blue:  { n_success: 5, n_total: 5 }
      pick_red:    { n_success: 5, n_total: 5 }
      pick_green:  { n_success: 5, n_total: 5 }
      pick_blue:   { n_success: 5, n_total: 5 }
    summary:
      n_success_total: 30
      success_rate: 1.00
      cost_usd: 1.50
      wall_clock_min: 10.5
  end_to_end_totals:
    cost_usd: 5.02   # synthesis + eval
    wall_clock_min: 18.9
  what_is_synthesized: |
    Arm kinematics (FK / DLS-IK / move_cartesian), gripper actuator
    commands, proximity-based grasp detection (2 cm threshold), and
    weld-active toggle in gripper_close — all written by the agent.
  post_synthesis_patches: |
    Two small helper patches were applied because the synthesis prompt
    did not require them:
    (1) get_object_position(body_name) — 5 lines, world-frame body
        position lookup via mj_name2id + mj_forward.
    (2) eq_data relpose update inside gripper_close — 8 lines, sets
        the weld's relative pose to current link6→cube transform so
        the weld holds the object at its current pose instead of the
        MJCF-load-time pose.
    These are MuJoCo implementation details not in the synthesis spec;
    a tightened spec is open work.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 10: Quadruped v2 locomotion suite (§5.5 cross-robot)
# 10-task v2 suite with physics-grounded scoring (body-height ratios,
# forward-progress bands, phase-trajectory snapshots). Robot-diversity
# axis: fixed Sonnet 4.6, two quadrupeds. Source JSON at
# autoadapter_bench/results/quadruped_v2/
# ─────────────────────────────────────────────────────────────────────────
exp10_quadruped_v2:
  description: |
    10-task quadruped v2 suite, ReAct (ours) vs same-API CaP, both
    driving the SAME from-scratch driver. MAIN = Sonnet 4.5 agent on a
    Sonnet 4.5 driver (unified with the rest of the paper); Sonnet 4.6
    kept as an agent-version ablation (see ablation: below). Strict
    locomotion validator (sit must lower body < 0.8× stand height;
    walk must advance > 3cm). Robot-diversity axis = fixed Sonnet;
    model axis not varied here.
  source_json:   # MAIN (Sonnet 4.5)
    ours_go2:    autoadapter_bench/results/quadruped_v2/ours_go2_sonnet45.json
    ours_anymal: autoadapter_bench/results/quadruped_v2/ours_anymal_sonnet45.json
    cap_go2:     autoadapter_bench/results/quadruped_v2/cap_go2_sonnet45.json
    cap_anymal:  autoadapter_bench/results/quadruped_v2/cap_anymal_sonnet45.json
  per_robot:   # physics pass rate, 10 tasks × 5 trials = 50/cell (Sonnet 4.5)
    go2:
      ours:    { overall: 0.48, simple: 0.60, hard: 0.36 }
      cap:     { overall: 0.54, simple: 0.80, hard: 0.28 }
    anymal_c:
      ours:    { overall: 0.68, simple: 0.80, hard: 0.56 }
      cap:     { overall: 0.28, simple: 0.56, hard: 0.00 }
  ablation_sonnet46:   # agent-version ablation (App. robustness, tab:quad-ablation)
    go2:
      ours:    { overall: 0.44 }
      cap:     { overall: 0.54 }
    anymal_c:
      ours:    { overall: 0.62 }
      cap:     { overall: 0.50 }
  finding: |
    Mixed, embodiment-dependent result — neither method dominates.
    On ANYmal-C ReAct leads (68% vs 28%); on Go2 the order reverses
    (48% vs 54%). The two methods fail DIFFERENTLY:
      - CaP commits to ONE open-loop plan with no recovery. On ANYmal
        it fails every locomotion task beyond a single short walk
        (walk_10cm, both target bands, bounded_drift all 0/5). On Go2
        its tuned open-loop walk transfers (walk_forward_5cm 5/5,
        bounded_drift 4/5).
      - ReAct checks base pose between walks, which prevents collapses
        on ANYmal (bounded_drift 5/5) but on Go2's coarse walk
        increments (~0.15m minimum) it overshoots short walks
        (walk_forward_5cm 0/5, target_x_band_10cm 1/5); it still leads
        on explore_then_correct (5/5 vs 3/5).
    Both methods reliably solve sit, stand, and at least one short walk.
    The ANYmal-favours-A-A / Go2-reverses split holds under BOTH a
    Sonnet 4.5 and a Sonnet 4.6 agent (ablation_sonnet46 above).
    IMPORTANT correction: an earlier draft claimed band-stop tasks
    were physically impossible (a ~0.15m "granularity ceiling"); CaP
    falsifies this on Go2. a1 synthesis failed (walk dx < 0 in all 3
    attempts) and is not evaluated.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 11: Cross-model leaderboard, CORRECTED + 3 USES baselines (§5.3)
# Supersedes the A-A/CaP numbers wherever they appear. SO-101 13-task suite,
# N=5, trial-level physics. Reflects: (a) numpy-bool-as-string aggregation
# bug fixed (inflated ours ~8pp); (b) draw_letter_L replaced with a feasible,
# waypoint-verified L (old one was unreachable on SO-101 + return-home grader);
# (c) few-shot CaP added as a second baseline (all 7 models).
# Sources: results/clean/{ours,cap}_so101_<model>.json (corrected),
#          results/fewshot/cap_so101_<model>.json,
#          results/leaderboard_b/diag_<model>.json (Self).
# ─────────────────────────────────────────────────────────────────────────
exp11_leaderboard_corrected:
  suite: "SO-101 13-task"
  n_trials: 5
  metric: "trial_physics_pass_rate"
  uses_api:        # each model drives the FIXED reference (Sonnet) driver
    sonnet46:  { aa: 0.69, cap: 0.57, cap_fs: 0.54 }
    opus48:    { aa: 0.63, cap: 0.51, cap_fs: 0.42 }
    haiku45:   { aa: 0.62, cap: 0.54, cap_fs: 0.62 }
    novapro:   { aa: 0.60, cap: 0.57, cap_fs: 0.46 }
    deepseek:  { aa: 0.57, cap: 0.09, cap_fs: 0.60 }
    ministral8b: { aa: 0.54, cap: 0.23, cap_fs: 0.43 }
    qwen32:    { aa: 0.49, cap: 0.72, cap_fs: 0.57 }
  writes_api:      # synthesize own driver; Self = end-to-end on it
    # grasp-verified re-run (leaderboard_b_graspverified/, fixed object_lifted_by held-check):
    # Sonnet fails grasp validation (flung object); only 3/7 ship a working grasp driver.
    sonnet46:  { synth: "fail@validate:grasp_lift (0/2)", self: null }
    opus48:    { synth: pass, self: 0.46 }
    haiku45:   { synth: pass, self: 0.46 }
    deepseek:  { synth: pass, self: 0.28 }
    novapro:   { synth: "fail@study (0/3)", self: null }
    ministral8b: { synth: "fail@study (0/3)", self: null }
    qwen32:    { synth: "fail@validate:ik_roundtrip (0/3)", self: null }
  findings: |
    USING: Auto-Adapter (A-A) tops zero-shot CaP on 6/7 models and tops
    few-shot CaP on 4/7 (Haiku ties; DeepSeek and Qwen favour CaP_fs).
    Few-shot exemplars (extra human effort per API) only rescue weak
    models that cannot use the API zero-shot (DeepSeek 9->60,
    Ministral 23->43) and HURT strong ones (Sonnet 57->54, Opus 51->42);
    A-A wins Sonnet/Opus/Nova by 14-21 pts. SYNTHESIS: only 3/7 write a
    validated driver (use != synthesize; Sonnet fails grasp validation
    0/2); Qwen, the strongest CaP user (72%), cannot synthesize at all.
    Self (own driver) 28-46%, below the same three models' A-A
    reference (57-63%) but zero human driver code.
  bugfixes_applied: |
    1. numpy.bool_ serialized as string "False" was truthy-counted as a
       pass (eval.py); inflated only ours_* files ~8pp (CaP runner cast
       bool()). Fixed: bool() at storage + _true() in _build_aggregate +
       repaired 46 legacy JSONs. 0 anomalies remain (140 files scanned).
    2. draw_letter_L: old task unreachable on SO-101 (move to absolute
       z=-0.15, below floor) with a return-home-only grader -> hollow
       passes. Replaced with feasible down4+forward4+home L and an
       ee_waypoint_trace grader that verifies both corners are visited.
       Now a legitimate discriminator on weak models (DeepSeek ours 5/5
       vs CaP 1/5).

# ─────────────────────────────────────────────────────────────────────────
# Experiment 12: Morphology breadth — AERIAL (Skydio X2 quadrotor)
# Sources: autoadapter_bench/results/aerial/{ours,cap}_skydio_sonnet45.json
#          artifacts/from_scratch_aerial_v2/skydio_x2 (synthesized driver)
# ─────────────────────────────────────────────────────────────────────────
exp12_aerial_skydio:
  description: |
    4th morphology (aerial). Same from-scratch pipeline, class-specific GEN
    prompt + physics validator only. Skydio X2 free-flying quadrotor: 6-DoF
    floating base, 4 thrust rotors, underactuated + open-loop unstable. The
    synthesized driver implements a cascaded position->attitude->rotor-thrust
    feedback controller. Sonnet 4.5 agent + driver.
  onboarding:
    validate: "7/7 (build, home, takeoff-to-altitude upright, move_to no-flip)"
    outer_attempts: 0   # validated first try (v2, get_base_pose convention)
  suite: "8 tasks (4 simple + 4 hard), physics-graded on post-step base pose +
          upright. HARDENED to be inaction-proof: round-trip requires real
          excursion (min_excursion_m); hovers require commanded altitude
          (tol 0.15); box-patrol waypoint_tol 0.18 < square centre-to-corner
          0.283 (no centre-gaming); reach tol 0.20. Do-nothing agent = 0/8."
  results:   # physics pass rate, N=5, on the hardened suite
    ours: 1.00    # 8/8
    cap:  1.00    # 8/8
  finding: |
    On the HARDENED, inaction-proof suite, Auto-Adapter AND same-API CaP both
    reach 100%. Unlike contact-rich manipulation (exp11) and locomotion
    (exp10) where the multi-turn loop helps, point-to-point flight through the
    synthesized high-level API (takeoff/move_to) is solvable by a single-shot
    program, so A-A and CaP TIE. The aerial contribution is the VALIDATED
    FLIGHT CONTROLLER (cascaded thrust stabilizer, synth 7/7), not an
    agent-loop win.
    NOTE (correction): an earlier run reported ours 100% vs CaP 37.5%. That
    CaP number was INVALID — the CaP sandbox (runner.py _build_sandbox) bound
    only arm+quad methods, so the drone's flight API (takeoff/move_to/hover/
    land) was never exposed to CaP; its drone could not move and "passed" only
    inaction/loose-tol tasks. Fixed: CaP runner now binds aerial/wheeled/
    humanoid primitives + class-aware prompt; graders hardened against
    inaction. Re-run gives the fair 100%/100%.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 13: Morphology frontier — HUMANOID (Unitree H1 biped)
# Sources: artifacts/from_scratch_humanoid_v2/h1 (synthesis logs)
# ─────────────────────────────────────────────────────────────────────────
exp13_humanoid_h1:
  description: |
    5th morphology (humanoid biped). Unitree H1: 19 joint actuators + 6-DoF
    floating torso, 51.4 kg, tall inverted pendulum (open-loop falls).
    Joint-space PD balance controller synthesized from MJCF. Sonnet 4.5.
    Driver: artifacts/from_scratch_humanoid_v3/h1 (3rd synthesis attempt;
    v1 stand-only failed, v2 stand-ok/squat-topples, v3 full pass).
  onboarding:
    validate: "7/7 end-to-end. stand_balance PASS (torso 0.98m, upright 1.00
               held for full 2s); squat PASS (down then recover to 0.97m,
               upright 0.99 — does NOT topple)."
    reproducibility: "Under the benchmark protocol (home() first, as in
               validation/replay): stand 4/4 (h=0.977, up=1.00), squat-recover
               3/3 (post 0.974, up=1.00). Robust, not a fluke."
    outer_attempts: 1
  finding: |
    The agent synthesizes a VALIDATED balance controller for a 19-DoF biped
    zero-shot from the MJCF: it holds a stable stand (torso 0.98m, upright
    1.00) AND squat-recovers without toppling, passing onboarding 7/7 and
    reproducibly under the protocol. A genuine inverted-pendulum stabilization
    result on the hardest morphology in the zoo. We report it at the
    onboarding (synthesis-validation) level, where the orchestrator steps
    physics directly for stand+squat; we do not run a separate downstream task
    suite (a replay-based stand/squat eval is gameable by inaction, since a
    homed biped stays up if physics is not advanced). DYNAMIC WALKING:
    attempted (v4 synth: closed-loop micro-step gait + start-heading-frame
    validator) but NOT achieved — no stable validator-certified walk across
    attempts, and adding the walk objective even destabilised the
    otherwise-reliable stand (v4: 5/8, stand h=0.50). v3 (stand+squat, 7/7)
    stays the canonical humanoid driver; walking is the pipeline's frontier.

# ─────────────────────────────────────────────────────────────────────────
# Same-API learned baseline (PPO on the LLM's Cartesian+gripper tool layer)
# 3 seeds, n=30; cited in §5.1 (tab:cross-skill bottom block). 2026-06-15.
# source: autoadapter_bench/baselines/cartesian_rl_3seed.json (ran on local .venv-rl)
# ─────────────────────────────────────────────────────────────────────────
exp_same_api_rl:
  description: "PPO whose action space = LLM tool layer (Cartesian delta via driver IK + gripper bit), goal-conditioned"
  seeds: 3
  n_episodes: 30
  interface: "same high-level API as LLM/CaP"
  results:   # mean ± std over 3 seeds (percent)
    cart_reach_on_reach_own:  {mean: 100.0, std: 0.0}
    cart_pick_on_pick_own:    {mean: 100.0, std: 0.0}
    cart_reach_on_pick_cross: {mean: 25.6,  std: 12.6}
    cart_pick_on_reach_cross: {mean: 0.0,   std: 0.0}
    multitask_on_reach:       {mean: 100.0, std: 0.0}
    multitask_on_pick:        {mean: 100.0, std: 0.0}
  finding: |
    A same-API single-skill policy masters its trained skill (100%) but
    does not transfer (<=26% cross-skill); a same-API multi-task policy does
    both (100%) but only when trained on both. LLM/CaP do both zero-shot.
    => cost asymmetry (training run per skill set vs none), NOT LLM control
    superiority. Standard SB3 PPO, not SOTA-tuned (see Limitations).
