    - in_x-5
    - in_y+5
    - in_y-5
    - in_z+5
    - in_z-5
  ood_targets:
    ood_diag:     "[0.03, 0.03, 0.03]"
    ood_mag:      "[0.10, 0.0, 0.0]"
    ood_mixed:    "[0.05, 0.05, 0.0]"
    ood_far_diag: "[0.04, 0.04, -0.02]"
  n_episodes_per_task: 10
  deterministic: true
  source_json_ppo_dp: "autoadapter_bench/baselines/multi_task_eval.json"
  source_json_llm:    "autoadapter_bench/baselines/llm_multi_task_eval.json"

  ppo_multi:
    train_steps: 300000
    train_wall_sec: 1069   # includes some OS-suspended periods
    train_final_succ_rate_100ep: 1.00
    action_dim: 6   # 5 joint deltas + 1 gripper slot (ignored during reach training)
    in_dist_avg: 1.00
    ood_avg:     0.75
    gen_gap_pp:  25
    ood_failures:
      ood_mag: "0% (target +10cm X is outside workspace from home pose)"

  dp_multi:
    train_demos_per_direction: 100
    total_train_demos: 600
    train_wall_sec: 194
    train_final_loss: 0.012
    in_dist_avg: 0.60
    ood_avg:     0.05
    gen_gap_pp:  55
    note: "DP struggles with multi-modal action distribution across 6 directions."

  llm_agent:
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    in_dist_avg: 1.00
    ood_avg:     0.75
    gen_gap_pp:  25
    ood_failures:
      ood_mag: "0% (LLM correctly identifies the target as unreachable; IK throws IKUnreachableError after 15 retries)"
    total_cost_usd: 0.34
    n_episodes_per_task: 1
    note: |
      Multi-task PPO matches LLM agent within the trained skill family.
      Both fail on ood_mag (a workspace-boundary failure, not learning failure).

# ─────────────────────────────────────────────────────────────────────────
# Experiment 3: Cross-skill matrix (the centerpiece of the paper)
# (cited in §4.2)
# ─────────────────────────────────────────────────────────────────────────
#
# IMPORTANT: We report TWO experimental conditions to isolate the
# observation-aliasing artifact identified during review:
#   (a) `taskcond`: ReachXYZEnv and PickBananaEnv each prepend a one-hot
#       task identifier to the observation vector. The policy can read
#       which task it is in.
#   (b) `legacy`:   no task one-hot. Reach and Pick share the same obs
#       layout where the third triplet (goal XYZ) is either target_xyz
#       or banana_xyz. PPO_reach interprets banana_xyz as target.
#
# The `taskcond` numbers are the headline; the `legacy` numbers are the
# ablation showing the size of the observation-aliasing effect.
exp3_cross_skill:
  description: "Reach (4 variants × 10 ep) × Pick (10 randomized-banana ep), evaluated on each PPO + LLM. Compares with/without task one-hot in obs."
  reach_variants: 4
  reach_episodes_per_variant: 10
  pick_episodes: 10
  source_json_ppo_taskcond: "autoadapter_bench/baselines/cross_skill_eval_taskcond.json"
  source_json_ppo_legacy:   "autoadapter_bench/baselines/cross_skill_eval_v2.json"
  source_json_llm_reach: "autoadapter_bench/baselines/llm_reach_n10.json"
  source_json_llm_pick:  "autoadapter_bench/baselines/llm_pick_random_n10.json"

  ppo_reach_taskcond:    # 6-dim action, obs = [task_onehot(2), q(5), qdot(5), ee(3), target(3), err(3)]
    train_steps: 300000
    train_wall_sec: 1617
    train_final_succ_rate_100ep: 1.00
    own_task: 1.00          # Reach (4 variants × 10 ep)
    cross_task: 0.20        # Pick — residual OOD garbage, no longer obs-aliasing
    cross_task_finding: |
      With task one-hot, PPO_reach has never seen the [0,1] task signal
      that Pick observations carry. The 20% Pick "success" is a smaller
      residual: the policy outputs garbage actions when fed OOD obs,
      and occasionally those garbage actions happen to brush the banana
      with the gripper-slot output in closing range. This is genuine
      OOD failure noise, NOT learned cross-skill transfer.

  ppo_reach_legacy:      # ablation — no task one-hot
    own_task: 1.00
    cross_task: 0.50        # Higher: obs-aliasing actively exploited
    finding_vs_taskcond: |
      The 50%→20% drop (legacy→taskcond) directly measures the obs-
      aliasing effect Codex flagged. Without task one-hot, the policy
      reads banana_xyz in the same slot as its training target_xyz and
      moves toward it more deliberately; with task one-hot, it
      "knows" it's in an unfamiliar task and outputs uncorrelated
      garbage.

  ppo_pick_taskcond:     # 6-dim action, obs = [task_onehot(2), q(5), qdot(5), ee(3), banana(3), err(3)]
    train_steps: 200000
    train_wall_sec: 1008
    train_final_succ_rate_50ep: 0.50
    own_task_deterministic: 0.00
    own_task_stochastic:    0.70   # 7/10 episodes — up from 40% without task_id
    cross_task:             0.00   # Reach obs has task_onehot=[1,0]; pick policy never saw this
    own_task_finding: |
      Task one-hot improves PPO_pick stochastic eval from 40% to 70%
      — the policy now uses the task identifier to disambiguate
      training/eval distributions. Deterministic mode still 0%
      (proximity-bonus local optimum is unchanged).

  ppo_pick_legacy:       # ablation
    train_steps: 200000
    train_final_succ_rate_50ep: 0.46
    own_task_deterministic: 0.00
    own_task_stochastic:    0.40
    cross_task:             0.00

  ppo_pick_500k_legacy:
    train_steps: 500000
    train_wall_sec: 2654
    train_final_succ_rate_50ep: 0.14
    note: "Longer training collapses to a 'camp near banana with gripper closed' local optimum. Classic reward hacking. Reported as a negative-result data point."

  # Diffusion Policy cross-skill matrix (task-conditioned obs, taskcond)
  # Source: autoadapter_bench/baselines/dp_cross_skill_eval.json
  dp_reach_taskcond:
    train_demos: 600     # 100 per direction × 6 directions
    train_loss_final: 0.011
    own_task: 0.50       # 4 reach variants × 10 ep, avg 50%
    cross_task: 0.00     # Pick — clean 0% (no obs-aliasing thanks to task one-hot)
    note: "Multi-task BC on 6 reach directions; struggles with multi-modal action distribution. 50% on own task is a real ceiling, not a tuning failure."

  dp_pick_taskcond:
    train_demos: 200     # scripted policy, 187/200 successful demos
    train_loss_final: 0.070
    own_task: 0.10       # Pick — low because pick has multi-phase trajectories (approach/close/lift) that BC averages poorly
    cross_task: 0.00     # Reach — clean 0%, task_onehot=[1,0] never seen during training

  llm_agent_react:
    description: "Our ReAct-style multi-turn LLM agent"
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    reach: 1.00            # 40/40 episodes (4 variants × 10 ep, deterministic)
    pick:  1.00            # 10/10 randomized banana positions
    n_episodes_reach: 40   # 4 variants × 10
    n_episodes_pick: 10
    pick_cost_per_episode_usd: 0.080   # avg of 10 episodes
    reach_cost_per_episode_usd: 0.020
    pick_tool_calls_per_episode: "10-13"
    reach_tool_calls_per_episode: "2-3"
    pick_lift_range_cm: [2.85, 3.88]   # all 10 episodes exceeded the 2 cm threshold
    source_json_reach: "autoadapter_bench/baselines/llm_reach_n10.json"
    source_json_pick:  "autoadapter_bench/baselines/llm_pick_random_n10.json"

  cap_baseline:
    description: "Code-as-Policies single-shot baseline using the same auto-synthesized API"
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    reach: 1.00            # 40/40
    pick:  1.00            # 10/10
    n_episodes_reach: 40
    n_episodes_pick: 10
    pick_cost_per_episode_usd: 0.006   # ~10× cheaper than ReAct due to single-shot
    pick_tool_calls_per_episode: 6
    pick_lift_range_cm: [2.82, 5.90]
    source_json: "autoadapter_bench/baselines/cap_cross_skill.json"
    finding: |
      CaP achieves 100% on both Reach and Pick using only single-shot
      Python emission. The auto-synthesized API exposes enough
      primitives that no iteration is required for these tasks. This
      confirms the abstraction-level effect is the dominant driver of
      cross-skill success, not the specific LLM-agent loop style.
      ReAct's extra cost ($0.02-0.08 vs $0.006) buys robustness to
      API mis-use on harder tasks (cf. §appendix 14-task arm suite:
      ours 83% vs CaP 60%).

  pick_eval_protocol:
    note: |
      All Pick rows (PPO_pick, DP_pick, CaP, LLM agent) use n=10
      randomized banana positions drawn from {0.10, 0.22} × {0.04,
      0.20} m. PPO/DP use the env's internal RNG; CaP and LLM use
      a fixed RNG seed (banana_rng_seed=42 for CaP, =123 for LLM —
      pre-randomization done via per-episode MJCF rewrite). The
      distribution of banana positions is identical across methods;
      the specific positions differ across methods. This is the
      standard reach-and-grasp benchmark protocol (cf. §appendix
      pick_eval_protocol.md for verification).

# ─────────────────────────────────────────────────────────────────────────
# Experiment 4: OpenVLA-7B zero-shot on SO-101 (separate input modality)
# (cited in §4.5)
# ─────────────────────────────────────────────────────────────────────────
exp4_openvla:
  description: "OpenVLA-7B zero-shot on SO-101 reach; uses RGB image as input."
  model_id: "openvla/openvla-7b"
  embodiment_in_training: "Bridge V2 (WidowX 250) + Open-X mixture; SO-101 NOT in training distribution"
  inference_device: "NVIDIA A100-PCIE-40GB"
  inference_runtime: "PyTorch 2.4.1 + bfloat16"
  ee_delta_scale: 2.0   # canonical — matches both the SGE submission and the paper text
  n_episodes_per_task: 10
  max_steps_per_episode: 15
  move_cartesian_duration_s: 0.5   # FIXED 2026-06-15: was 0.1, too short to settle (any controller scored 0); see harness_validation
  rendering: "MuJoCo EGL backend, 480×640 RGB"
  source_json: "autoadapter_bench/baselines/vla/openvla_so101_reach_eval_fixed.json"

  harness_validation: |
    Oracle test (diag_openvla_harness.py): feeding the ground-truth
    direction (target − EE) through the SAME move_cartesian path reaches
    5/5 targets (mean 1.3 cm) at duration=0.5, but 0/5 at duration=0.1.
    So the controller-validated harness CAN succeed; OpenVLA's 0 is a
    model result, not a control-budget artifact. (The pre-fix 0/50 used
    duration=0.1 and was invalid.)

  results:   # fixed harness (duration=0.5), n=10/variant
    in_dist_x_plus_5:
      success_rate: 0.00
      mean_final_err_cm: 23.3
    ood_y_plus_5:
      success_rate: 0.00
      mean_final_err_cm: 19.7
    ood_z_plus_5:
      success_rate: 0.00
      mean_final_err_cm: 38.8
    ood_diag:
      success_rate: 0.00
      mean_final_err_cm: 15.2
    ood_neg_x:
      success_rate: 0.00
      mean_final_err_cm: 17.8

  summary:
    overall_success_rate: 0.00
    avg_final_err_cm: 23.0
    n_episodes_total: 50   # 5 tasks × 10 ep

  robustness_sweep:   # eval_openvla_sweep.py → openvla_sweep.json
    description: "13 configs (6 action scales × bridge_orig + 7 other unnorm keys @ 2.0), 3 ep × 5 variants each"
    best_overall_success_rate: 0.067   # one chance episode; canonical config (bridge_orig × 2.0) = 0%
    all_other_configs: 0.00
    conclusion: "0% is robust to de-normalization key and action scale 0.25–10×"

  finding: |
    With the controller-validated harness (oracle 5/5), OpenVLA still
    scores 0/50: it emits deltas in inconsistent / wrong directions
    (~23 cm/step of EE motion). Bridge V2's camera/EE convention is not
    aligned with SO-101's, and SO-101 is outside the Open-X mixture.
    Pretrained VLA weights do not zero-shot transfer to OOD embodiments;
    per-robot finetuning is required (Kim et al. 2024 §3). The 0 is
    robust across 8 unnorm keys and action scales 0.25–10× (sweep above).

  modality_caveat: |
    Input modality (RGB) differs from PPO/DP/LLM-agent baselines (all
    read privileged simulator state). This comparison is reported in
    its own subsection (§4.5) NOT in the main cross-skill table to
    keep modalities distinct.

