# ─────────────────────────────────────────────────────────────────────────
# Experiment 5b: Second-robot cross-skill (Franka) — honest negative finding
# (cited in §6 Limitations)
# ─────────────────────────────────────────────────────────────────────────
exp5b_franka_cross_skill:
  description: |
    Spot-check the LLM-agent layer on a second robot (Franka Panda
    7-DoF) using the synthesized driver from the §4.1 scoreboard.
    Re-evaluated with CORRECTED methodology that aligns the eval target
    with the initial qpos the agent actually observes (see §6.2.1
    methodology note).
  workspace: artifacts/auto_adapter_from_scratch_franka_artifacts/
  source_json: autoadapter_bench/baselines/llm_franka_proper_reach_n10.json

  llm_agent_react_reach:
    # N=10 trials per variant, Sonnet 4.5 (deterministic outputs)
    reach_x+5:    { n_success: 10, n_total: 10, err_cm: 1.76, success: true  }
    reach_z+5:    { n_success: 10, n_total: 10, err_cm: 0.13, success: true  }
    reach_x-5:    { n_success:  0, n_total: 10, err_cm: 3.95, success: false }
    reach_y+5:    { n_success:  0, n_total: 10, err_cm: 2.73, success: false }
    reach_y-5:    { n_success:  0, n_total: 10, err_cm: 2.74, success: false }
    reach_diag:   { n_success:  0, n_total: 10, err_cm: 2.04, success: false }
    reach_z-5:    { n_success:  0, n_total: 10, err_cm: 11.07, success: false }
    summary:
      n_variants: 7
      n_trials_per_variant: 10
      n_trials_total: 70
      n_success_total: 20
      success_rate: 0.286   # 20 / 70
      mean_err_cm: 3.49
      total_cost_usd: 2.69
      wall_clock_minutes: 17.7
      finding: |
        Agent correctly uses observed get_ee_pose output, emits the
        right target (initial_ee + offset). The 4 failing 2-4 cm
        variants are dominated by Franka driver IK precision (~1-2 mm
        residual → 2-4 cm Cartesian). reach_z-5 is a genuine
        workspace-boundary failure (singularity at z<0.876 from
        starting pose). Sonnet 4.5 is deterministic over identical
        inputs; n=10 confirms the agent emits the same target every
        trial — driver consistency is the variance source, not LLM.

  methodology_note: |
    The earlier draft of this experiment reported 0/20 success with a
    "per-robot canonical-pose memorization" hypothesis. That was an
    eval-methodology bug: we computed the success target from the
    home()-ed EE position (`(0.549, 0, 0.647)`) but the agent's
    `execute_task` does not call home() — the agent sees the
    MJCF-default qpos's EE at `(0.088, 0, 0.926)` and correctly adds
    its offset to that. The 53.85 cm difference between home() and
    fresh-load EE on Franka exactly matched the "error" we were
    reporting, which is what made the artifact look like a clean
    finding. SO-101's home/fresh diff is 0.43 cm so the methodology
    bug had no impact there. KUKA iiwa14 has a 122 cm diff so an
    earlier KUKA experiment was similarly affected.

    The corrected numbers above use the SAME initial qpos for both
    the agent and the target computation. Cross-robot spot-checks
    have not been re-run on KUKA / Piper / UR5e / iiwa14 / quadrupeds.

# ─────────────────────────────────────────────────────────────────────────
# Experiment 6: Outer GEN←VAL loop empirical verification
# (cited in §3.2)
# ─────────────────────────────────────────────────────────────────────────
exp6_outer_gen_val_loop:
  description: |
    Empirical check that the outer GEN←VAL retry loop works end-to-end
    and doesn't break the pipeline. SO-101 reran with max_outer_gen_val_iters=3.
  robot: SO-101
  config:
    max_outer_gen_val_iters: 3
    max_iters_generate_inner: 22
    max_iters_validate_inner: 25
  result:
    outer_iters_used: 1
    structural_tests_passed: [driver_build, home_settle, ik_roundtrip, gripper_cycle, grasp_lift]
    structural_tests_failed: []
    wall_clock_min: 5.1
    cost_usd: 1.54
    phases_completed: [01_study, 02_generate, 03_validate, 04_export, 05_demo]
  finding: |
    Outer loop converged at iteration 1 (single GENERATE pass; no retry
    triggered). Inner CodeAct loop within GENERATE (agent uses
    `exec_python` to test draft drivers in sim) is sufficient for
    SO-101. The outer loop is best read as a robustness mechanism for
    harder embodiments rather than a frequently-firing inner loop.

