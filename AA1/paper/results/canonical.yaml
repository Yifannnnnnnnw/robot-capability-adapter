  source_json: "autoadapter_bench/baselines/rl/trained/so101_reach_eval.json"
  n_episodes_per_task: 10
  deterministic: true
  target_offset_m:
    in_dist_x_plus_5: [0.05, 0.0, 0.0]
    ood_y_plus_5:     [0.0, 0.05, 0.0]
    ood_z_plus_5:     [0.0, 0.0, 0.05]
    ood_diag:         [0.03, 0.03, 0.03]
    ood_neg_x:        [-0.05, 0.0, 0.0]

  ppo:
    train_steps: 50000
    train_wall_sec: 66
    train_final_succ_rate: 0.84
    in_dist_x_plus_5: 1.00
    ood_y_plus_5:     0.00
    ood_z_plus_5:     0.00
    ood_diag:         0.00
    ood_neg_x:        0.00
    in_dist_avg:      1.00
    ood_avg:          0.00
    gen_gap_pp:       100

  diffusion_policy:
    train_demos: 200
    train_wall_sec: 59
    train_final_loss: 0.018
    in_dist_x_plus_5: 1.00
    ood_y_plus_5:     0.00
    ood_z_plus_5:     0.00
    ood_diag:         0.00
    ood_neg_x:        1.00      # DP serendipitously generalizes to ±X by symmetry
    in_dist_avg:      1.00
    ood_avg:          0.25
    gen_gap_pp:       75

  llm_agent:
    model_id: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    source_json: "autoadapter_bench/baselines/rl/trained/llm_5tasks_honest_eval.json"
    in_dist_x_plus_5: 1.00
    ood_y_plus_5:     1.00
    ood_z_plus_5:     1.00
    ood_diag:         1.00
    ood_neg_x:        1.00
    in_dist_avg:      1.00
    ood_avg:          1.00
    gen_gap_pp:       0
    total_cost_usd:   0.14
    n_episodes_per_task: 1   # deterministic LLM, repeated calls collapse to same plan
    note: |
      LLM agent is deterministic given identical prompt+task description;
      we run one episode per task variant. This is a methodological choice,
      not a sample-size weakness — replay-in-sim is the success metric so
