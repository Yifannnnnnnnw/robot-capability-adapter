[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-adapter"
version = "0.1.0"
description = "LLM agent that synthesizes deployable robot drivers from MJCF/URDF specifications"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Vector Robotics"}]
keywords = ["robotics", "llm", "code-generation", "robot-driver", "tool-use", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.24",
    "mujoco>=3.0",
    "anthropic>=0.40",
    "boto3>=1.34",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "torch>=2.0",
    "stable-baselines3>=2.0",
    "gymnasium>=0.29",
    "diffusers>=0.30",
]
vla = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.40.1",
    "accelerate==0.32.1",
    "timm==0.9.10",
    "huggingface_hub",
    "pillow",
]

[tool.hatch.build.targets.wheel]
packages = ["auto_adapter", "autoadapter_bench"]
