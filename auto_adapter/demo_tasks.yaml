# Fixed diagnostic demo goals and public parameters; these are not solver actions.
# Scene paths are relative to the AA1 root. Use the matching generated driver/model.
# Success tolerances are manually authored diagnostic requirements, not calibrated
# performance claims. Gap endpoints define measured geometry; see DEMO_CONFIGURATION.md.
robots:
  so101:
    task: >-
      Move the end effector through the two world-frame checkpoints in the listed order, using at
      most 3 seconds per segment. Then set the gripper opening to 20% of its full opening and set it
      to 80%, using at most 2 seconds for each change.
    scene: assets/mjcf/demo_scenes/so101/fixed_scene.xml
    initial_state:
      robot:
        qpos_by_joint:
          shoulder_pan: 0.0
          shoulder_lift: 0.0
          elbow_flex: 0.0
          wrist_flex: 0.0
          wrist_roll: 0.0
          jaw_visual_joint: -0.175
      settle_s: 0.5
      ctrl_by_actuator:
        act_shoulder_pan: 0.0
        act_shoulder_lift: 0.0
        act_elbow_flex: 0.0
        act_wrist_flex: 0.0
        act_wrist_roll: 0.0
        act_jaw_visual: -0.175
    parameters:
      waypoints_world_m: [[0.4, 0.02, 0.24], [0.405, 0.03, 0.238]]
      max_duration_per_segment_s: 3.0
      closed_opening_fraction: 0.2
      open_opening_fraction: 0.8
      max_gripper_duration_s: 2.0
      end_effector_reference: {kind: site, name: ee_site}
    success:
      type: arm_waypoints_gripper
      bindings:
        ee: {kind: site, name: ee_site}
        gripper_left:
          {kind: body, name: gripper_link, local_position_m: [-0.0079000005, 0.0009005476, -0.1030747650]}
        gripper_right:
          {kind: body, name: jaw_visual, local_position_m: [-0.0120270400, -0.0816157070, 0.0183613345]}
      waypoint_tolerance_m: 0.003
      waypoint_motion_m: 0.003
      opening_gap_closed_m: 0.0025220440
      opening_gap_open_m: 0.1378761582
      opening_gap_tolerance_m: 0.003
      opening_gap_motion_m: 0.003
      opening_gap_labels: [gripper_left, gripper_right]
