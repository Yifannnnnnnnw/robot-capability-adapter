  ur5e:
    task: >-
      Use the bare UR5e arm's `attachment_site` as the end-effector reference. Starting from the
      `home` keyframe, move the six named arm joints to the listed bounded configuration and return
      to `home`, using at most 2 seconds for each leg.
    scene: assets/mjcf/universal_robots_ur5e/scene.xml
    initial_state:
      robot:
        keyframe: home
    parameters:
      target_joint_positions_rad:
        shoulder_pan_joint: -1.5
        shoulder_lift_joint: -1.45
        elbow_joint: 1.45
        wrist_1_joint: -1.45
        wrist_2_joint: -1.55
        wrist_3_joint: 0.1
      max_duration_per_leg_s: 2.0
    success:
      type: joint_ordered_roundtrip
      bindings:
        shoulder_pan_joint: {kind: joint, name: shoulder_pan_joint}
        shoulder_lift_joint: {kind: joint, name: shoulder_lift_joint}
        elbow_joint: {kind: joint, name: elbow_joint}
        wrist_1_joint: {kind: joint, name: wrist_1_joint}
        wrist_2_joint: {kind: joint, name: wrist_2_joint}
        wrist_3_joint: {kind: joint, name: wrist_3_joint}
        ee: {kind: site, name: attachment_site}
      joint_order: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
      target_joint_vector: true
      return_joint_vector: true
      deadline_parameter: max_duration_per_leg_s
      joint_tolerance_rad: 0.03
      joint_motion_rad: 0.01
  unitree_g1:
