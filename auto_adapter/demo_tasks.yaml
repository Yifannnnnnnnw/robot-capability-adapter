  go2:
    task: >-
      Hold a stable stance for 1.2 seconds. Move forward 10 centimetres along the initial heading
      without changing heading, using at most 5 seconds. Hold a stable stance for another 1.2 seconds.
      Crouch to a body height of 0.26 metres, then rise to 0.32 metres and hold a stable stance for
      1.2 seconds. Use at most 3 seconds for each height change; remain upright throughout.
    scene: assets/mjcf/go2/go2_scene.xml
    initial_state:
      robot:
        keyframe: home
      free_bodies:
        base_link:
          position_m: [0.0, 0.0, 0.27]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      initial_stand_s: 1.2
      translation_initial_yaw_m: [0.1, 0.0]
      yaw_delta_rad: 0.0
      max_walk_duration_s: 5.0
      post_walk_stand_s: 1.2
      crouch_height_m: 0.26
      standing_height_m: 0.32
      max_height_change_duration_s: 3.0
      final_stand_s: 1.2
    success:
      type: quadruped_stance_walk_height
      bindings:
        base: {kind: body, name: base_link}
      walk_position_tolerance_m: 0.02
      walk_lateral_tolerance_m: 0.02
      yaw_tolerance_rad: 0.0872665
      height_tolerance_m: 0.015
      upright_tolerance_rad: 0.15
      stable_linear_speed_m_s: 0.2
      stable_angular_speed_rad_s: 0.4
