      bindings:
        ee: {kind: site, name: ee_site}
        tee: {kind: body, name: tee}
        obstacle: {kind: body, name: obs}
        cube_red: {kind: body, name: cube_red}
        cube_green: {kind: body, name: cube_green}
        cube_blue: {kind: body, name: cube_blue}
      contact_tool_body_names: [gripper_link]
      obstacle_label: obstacle
      safety_body_labels: [cube_red, cube_green, cube_blue]
      contact_position_tolerance_m: 0.05
      object_position_tolerance_m: 0.01
