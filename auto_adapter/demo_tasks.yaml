      Keep the fixed `obs` body out of the motion.
    scene: assets/mjcf/pushbench/so101_pushbench.xml
    initial_state:
      robot:
        qpos_by_joint:
          shoulder_pan: 0.0
          shoulder_lift: 0.0
          elbow_flex: 0.0
          wrist_flex: 0.0
          wrist_roll: 0.0
          jaw_visual_joint: 0.0
      free_bodies:
        tee:
          position_m: [0.18, -0.05, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_red:
          position_m: [0.1, 0.1, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_green:
          position_m: [0.18, 0.12, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        cube_blue:
          position_m: [0.14, 0.18, 0.025]
          quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
    parameters:
      pushed_body: tee
