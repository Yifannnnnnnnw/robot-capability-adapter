schema_version: robot_capability.library_manifest.v1
library_type: experience
entry_id: soarm101_evolution_experience
version: 1.1.0
status: ready
generation_visibility: mixed
payloads:
- path: sources.yaml
  visibility: generation
  media_type: application/yaml
  required: true
- path: experience.schema.json
  visibility: framework
  media_type: application/schema+json
  required: true
- path: records.jsonl
  visibility: framework
  media_type: application/x-ndjson
  required: true
content_hashes:
  algorithm: sha256_raw_bytes
  sources.yaml: 0859136be1624d9ebdb0322db12fda81a9719c83ed61f8b99584dbc23e7bb619
  experience.schema.json: a3fa8f4f460ae8460c6b80bb0851a96cc6d0cac626c660cb93ca44e29878f247
  records.jsonl: f48f1611bfaa00797dde6ff48f9f04f137394b73847792f13c3fd97a264c8a50
compatibility:
  robots:
  - soarm101
  runtime_ids:
  - lerobot_soarm101_0_6_0
  stages:
  - generation_stage_1
  - generation_stage_2
  - generation_repair
  record_count: 2
  interface:
    list:
      signature: list() -> list[ExperienceRecord]
      empty_result: []
      ordering: lexicographic_by_experience_id_then_semver
    select:
      signature: 'select(ids: list[str]) -> list[ExperienceRecord]'
      empty_ids_result: []
      missing_id_behavior: raise ExperienceNotFoundError
      duplicate_id_behavior: reject_before_read
      ordering: preserve_requested_id_order
    generation_view:
      signature: 'generation_view(ids: list[str] | None = None, *, exclude_source_run_ids: set[str] | None = None) -> list[dict]'
      empty_ids_result: []
      allowed_fields:
      - experience_id
      - version
      - conclusion_kind
      - scope
      - failure_summary.category
      - failure_summary.symptom
      - diagnosis.hypothesis
      - diagnosis.confidence
      - recommended_change.change_type
      - recommended_change.guidance
      - recommended_change.must_preserve
      - scientific_claims.framework_change_applied
      - scientific_claims.capability_improvement_proven
      - scientific_claims.new_generation_validation_required
      - generation_summary
      forbidden_fields:
      - origin.run_id
      - evidence.artifact_refs
      - evidence.before_measurements
      - evidence.after_measurements
      - private_task_or_oracle_content
  write_policy:
    automatic_writeback: trusted_evolution_gate_only
    records_must_be_schema_valid: true
    records_must_pass_privacy_and_evidence_gates: true
    source_run_cannot_consume_its_own_record: true
provenance:
  created_for: soarm101_minimal_capability_generation_demo
  created_on: 2026-08-04
  initial_state: Empty before the first trusted Evolution publication.
