schema_version: robot_capability.morphology_kinematics.v1
robot_id: soarm101
model_file: model/so101.xml
morphology_family: fixed_base_serial_manipulator
description: Five revolute arm joints followed by one actuated revolute gripper joint.

coordinate_convention:
  source: MJCF
  handedness: right_handed
  linear_unit: m
  angular_unit: rad
  base_frame: baseframe
  note: Joint axes are expressed in each joint's local body frame, as defined by MJCF.

base:
  fixed: true
  body: base
  frame_site: baseframe

dofs:
  total: 6
  arm: 5
  gripper: 1
  qpos: 6
  qvel: 6

command_limit_policy:
  effective_range_rule: Use the closed intersection of each MJCF joint range and actuator ctrlrange.
  conversion_roundoff_margin_rad: 0.00001
  validated_dynamic_margin_rad: 0.02
  effective_interior_margin_rule: Apply the larger of the conversion roundoff margin and the validated dynamic tracking margin at both ends of the joint-range/actuator-ctrlrange intersection.
  conversion_policy: Apply the effective interior margin in radians before converting to SDK degrees; never command an exact endpoint after unit conversion because roundoff and servo tracking can cross the tighter bound.
  long_distance_joint_motion:
    status: required_but_unverified
    single_step_prohibited: true
    bounded_waypoint_interpolation_required: true
    poll_every_waypoint: true
    unresolved_gap: A one-shot simultaneous move and 20, 10, and 5 degree waypoint candidates produced real MuJoCo joint-limit overshoot. A 2 degree candidate was safe only for two selected mixed-endpoint probes, while isolated shoulder-lift endpoint probes still crossed limits and an elbow endpoint trajectory timed out after self-contact; therefore no reusable maximum arm/gripper waypoint step is verified across both directions and coupled configurations.
    evidence_source: Deterministic real MuJoCo MjModel/MjData endpoint and waypoint scan through only the public LeRobot-compatible send_action/get_observation facade, with host auto-step disabled and framework-owned per-tick evidence; gripper command 1.1 itself did not cross its limit in the scanned matrices.

joints:
  - name: shoulder_pan
    sdk_key: shoulder_pan.pos
    type: revolute
    mjcf_type: hinge
    body: shoulder
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-1.91986, 1.91986]
    qpos_index: 0
    actuator: shoulder_pan
    actuator_ctrlrange_rad: [-1.91986, 1.91986]
  - name: shoulder_lift
    sdk_key: shoulder_lift.pos
    type: revolute
    mjcf_type: hinge
    body: upper_arm
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-1.7453293, 1.7453293]
    qpos_index: 1
    actuator: shoulder_lift
    actuator_ctrlrange_rad: [-1.74533, 1.74533]
  - name: elbow_flex
    sdk_key: elbow_flex.pos
    type: revolute
    mjcf_type: hinge
    body: lower_arm
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-1.69, 1.69]
    qpos_index: 2
    actuator: elbow_flex
    actuator_ctrlrange_rad: [-1.69, 1.69]
  - name: wrist_flex
    sdk_key: wrist_flex.pos
    type: revolute
    mjcf_type: hinge
    body: wrist
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-1.658063, 1.658063]
    qpos_index: 3
    actuator: wrist_flex
    actuator_ctrlrange_rad: [-1.65806, 1.65806]
  - name: wrist_roll
    sdk_key: wrist_roll.pos
    type: revolute
    mjcf_type: hinge
    body: gripper
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-2.7438473, 2.7438473]
    qpos_index: 4
    actuator: wrist_roll
    actuator_ctrlrange_rad: [-2.74385, 2.84121]
    note: The positive actuator control bound exceeds the MJCF joint bound; consumers must respect the tighter joint bound.
  - name: gripper
    sdk_key: gripper.pos
    type: revolute
    mjcf_type: hinge
    body: moving_jaw_so101_v1
    axis_local: [0.0, 0.0, 1.0]
    range_rad: [-0.174533, 1.7453292]
    qpos_index: 5
    actuator: gripper
    actuator_ctrlrange_rad: [-0.17453, 1.74533]

end_effector:
  body: gripper
  frame_site: gripperframe
  site_pose_in_body:
    position_m: [0.012, -0.000218, -0.098127]
    quaternion_wxyz_source: [1.0, 0.0, 1.0, 0.0]
    note: MuJoCo normalizes the source quaternion while compiling.

gripper:
  present: true
  actuation: single_revolute_moving_jaw
  joint: gripper
  fixed_jaw_body: gripper
  moving_jaw_body: moving_jaw_so101_v1
  sdk_key: gripper.pos
  sdk_unit_mapping: Defined by the selected SDK/runtime entry, not by this morphology entry.

gripper_contact_model:
  evidence_source: Compiled MuJoCo geom poses from the pinned robot-only MJCF.
  frame: gripperframe
  command_key: gripper.pos
  command_unit: normalized_0_100
  pinch_axis_in_frame: [0.0, 0.0, 1.0]
  approach_axis_in_frame: [1.0, 0.0, 0.0]
  fixed_tip_centroid_in_frame_m: [0.00053966666666666, 0.000218, -0.0201]
  closed_tool_center_in_frame_m: [-0.0008769592416551508, 0.00008466666666667, -0.018428429965433475]
  aperture_definition: Euclidean distance between the three-sphere fixed-jaw and moving-jaw tip centroids.
  tool_center_definition: Midpoint between the fixed-tip centroid and moving-tip centroid at the selected open command; this selected-open tool center, not the closed tool center, is the IK point that must be aligned with the object before closing.
  aperture_samples:
    - command: 0.0
      joint_position_rad: -0.17453
      aperture_m: 0.004390331706086472
      moving_tip_centroid_in_frame_m: [-0.0022935851499769617, -0.00004866666666666, -0.01675685993086697]
      tool_center_in_frame_m: [-0.0008769592416551508, 0.00008466666666667, -0.018428429965433475]
    - command: 20.0
      joint_position_rad: 0.20944200000000004
      aperture_m: 0.03231935622858095
      moving_tip_centroid_in_frame_m: [0.001781098800465119, -0.00004866666666666, 0.012194403883273293]
      tool_center_in_frame_m: [0.0011603827335658895, 0.00008466666666667, -0.0039527980583633535]
    - command: 24.0
      joint_position_rad: 0.2862364
      aperture_m: 0.0381598
      moving_tip_centroid_in_frame_m: [0.00124916, -0.00004867, 0.01805225]
      tool_center_in_frame_m: [0.00089442, 0.00008467, -0.00102387]
    - command: 40.0
      joint_position_rad: 0.5934140000000001
      aperture_m: 0.06094364393630282
      moving_tip_centroid_in_frame_m: [-0.005286241987521752, -0.00004866666666666, 0.04056395481236616]
      tool_center_in_frame_m: [-0.002373287660427546, 0.00008466666666667, 0.01023197740618308]
    - command: 60.0
      joint_position_rad: 0.9773860000000002
      aperture_m: 0.08740285274486521
      moving_tip_centroid_in_frame_m: [-0.022466376790272403, -0.00004866666666666, 0.06422027941893288]
      tool_center_in_frame_m: [-0.010963355061802871, 0.00008466666666667, 0.02206013970946644]
  verified_tabletop_pinch_baseline:
    evidence_source: tests/test_gripper_contact_profile.py::test_command_20_profile_places_releases_and_retreats_with_post_conversion_fk_bound; deterministic real MuJoCo with host auto-step disabled, framework-owned stepping, and control through only the public LeRobot-compatible send_action/get_observation facade.
    fixed_wrist_roll_rad: -1.5707963267948966
    minimum_total_aperture_clearance_m: 0.002
    approach_height_above_object_m: 0.10
    descent_waypoints: 20
    close_waypoints: 25
    lift_height_m: 0.09
    lift_waypoints: 18
    verified_holding_motion_interpolation:
      status: verified
      phases: [lift, transport, lower]
      lift_waypoints: 18
      lower_waypoints: 20
      maximum_transport_waypoint_step_m: 0.02
      omit_current_pose_waypoint: true
      evidence_source: tests/test_gripper_contact_profile.py::test_command_20_profile_places_releases_and_retreats_with_post_conversion_fk_bound; the real-MuJoCo episode used 18 vertical lift waypoints, 20 lower waypoints, and Cartesian transport segments no longer than 0.02 m.
    verified_controlled_point_ik:
      status: verified
      phases: [approach, descent, lower]
      point_source: selected_open_aperture_sample.tool_center_in_frame_m
      tolerance_m: 0.0006
      post_clamp_fk_check_required: true
      post_clamp_fk_point_source: selected_open_aperture_sample.tool_center_in_frame_m
      post_clamp_fk_tolerance_m: 0.0006
      evidence_source: tests/test_gripper_contact_profile.py::test_command_20_profile_places_releases_and_retreats_with_post_conversion_fk_bound
      directly_replayed_real_mujoco_phases: [approach, descent, close, lift, transport, lower, release_dwell, vertical_retreat, settle]
      directly_measured_physical_outcomes: [opposing_jaw_grasp, lift, supported_placement, release, vertical_retreat, settled_object]
      directly_checked_numeric_chain: [effective_interior_clamp_rad, sdk_degree_conversion, runtime_accepted_action_round_trip, exact_fk_selected_open_tool_point]
      derived_safety_contract_requirement: Apply the directly checked 0.0006 m post-conversion exact-FK bound to approach, descent, and lower whenever the selected-open tool center is clearance-critical; this is a locally derived consumer safety requirement, not an upstream manufacturer claim.
    verified_close_command:
      status: verified
      command: 1.1
      command_unit: normalized_0_100
      actuator_ctrl_span_rad: 1.91986
      validated_dynamic_margin_rad: 0.02
      minimum_normalized_interior_command: 1.041742627066557
      normalization_formula: validated_dynamic_margin_rad * 100 / actuator_ctrl_span_rad
      evidence_source: Deterministic real MuJoCo direct probes with host auto-step disabled; command 1.1 retained opposing-jaw contact and passed cube pick-place, cylinder lift, and two-cube ordered placement without actuator/joint-limit evidence.
    verified_arm_waypoint_completion_policy:
      status: verified
      global_deadline_is_outer_bound: true
      waypoint_settle_timeout_s: 3.0
      poll_period_s: 0.02
      required_consecutive_polls: 2
      omit_current_pose_waypoint: true
      open_or_pre_contact_motion:
        phases: [approach, descent, vertical_retreat, inter_object_transit]
        criterion: all_five_arm_joint_errors_within_deg
        maximum_joint_error_deg: 1.0
      contact_holding_motion:
        phases: [lift, transport, lower]
        criterion: observed_vs_commanded_arm_fk_translation_error
        controlled_point_in_gripperframe_m: [0.0, 0.0, 0.0]
        maximum_fk_translation_error_m: 0.01
      settle_expiry_result: truthful_phase_timeout
      evidence_source: Two repeated deterministic real-MuJoCo replays of the frozen run-j five-case suite with host auto-step disabled. A 3.0 s per-waypoint settle bound, two consecutive 0.02 s polls, and 0.01 m observed-versus-commanded gripperframe-origin FK error for lift/transport/lower passed cube pick-place, cylinder lift, and two-cube ordered placement with all forbidden-evidence flags false; 0.5 s and 1.5 s settle candidates were rejected by the same replay.
    pre_contact_completion_policy: Poll all commanded joints for bounded convergence during approach and descent; send_action only acknowledges target acceptance and never proves arrival.
    contact_phase_completion_policy: During gradual close, stop at verified close command 1.1 and use a bounded dwell while holding the arm; after contact the jaw is physically blocked and must not be required to reach command 1.1. During lift/transport/lower, explicitly retain command 1.1 and apply verified_arm_waypoint_completion_policy to the five observed arm joints. The trusted oracle judges terminal opposing contact and object motion.
  tabletop_release_and_sequence_requirements:
    evidence_source: Failure-localized real MuJoCo multi-object traces, the verified interpolated lift baseline, and tests/test_gripper_release_clearance.py::test_independent_release_aperture_prevents_cylinder_retreat_recontact.
    release_dwell_s: 0.5
    minimum_vertical_retreat_m: 0.09
    retreat_waypoints: 18
    release_aperture_selection:
      status: verified
      object_extent_semantics: maximum_horizontal_extent_m
      minimum_total_aperture_clearance_m: 0.008
      selection_rule: smallest_sample_with_aperture_m_gte_object_extent_m_plus_minimum_total_aperture_clearance_m
      independent_from_grasp_aperture_selection: true
      selected_sample_name: selected_release_aperture_sample
      command_source: selected_release_aperture_sample.command
      tool_center_source: selected_release_aperture_sample.tool_center_in_frame_m
      no_qualifying_sample_result: invalid_extent
      evidence_source: tests/test_gripper_release_clearance.py::test_independent_release_aperture_prevents_cylinder_retreat_recontact; three deterministic real-MuJoCo repetitions through the public LeRobot-compatible facade selected command 20 for grasp and command 24 for release of a generic 0.030 m cylinder, cleared both jaws before retreat, and remained settled without forbidden evidence.
    gripper_phase_command_contract:
      holding_motion:
        phases: [lift, transport, lower]
        gripper_command_source: verified_tabletop_pinch_baseline.verified_close_command.command
        explicit_command_required_each_action: true
      post_release_retreat:
        phases: [release_dwell, vertical_retreat]
        gripper_command_source: selected_release_aperture_sample.command
        tool_center_source: selected_release_aperture_sample.tool_center_in_frame_m
        explicit_command_required_each_action: true
        same_selected_release_command_required_every_retreat_tick: true
        same_selected_release_tool_center_required_for_retreat_ik: true
      commands_must_be_distinct: true
    multi_object_safe_transit:
      status: verified
      path_space: cartesian
      safe_z_rule: z_m >= min(completed_retreat_tool_z_m, next_approach_tool_z_m)
      maximum_cartesian_waypoint_step_m: 0.02
      completed_vertical_retreat_required: true
      single_joint_space_jump_prohibited: true
      evidence_source: Deterministic real MuJoCo two-cube sequence probes; each object succeeded alone, a single joint-space inter-object jump swept the second cube, and high-Z Cartesian interpolation at no more than 0.02 m per waypoint completed both placements without forbidden evidence.
    sequence_move_item_contract:
      source_position_field: source_position_m
      target_position_field: target_position_m
      object_extent_field: object_extent_m
      object_extent_semantics: maximum_horizontal_extent_m
      position_components: xyz
      fields_are_literal_keys: true
      object_extent_required_per_move: true
      hardcoded_default_object_extent_prohibited: true
    completion_policy: At the supported target, independently select the smallest release aperture sample with at least 0.008 m total clearance beyond the supplied object extent. Hold that release sample's command for the bounded release dwell, require jaw clearance before retreat, and explicitly retain the same release command and release-sample tool center for every vertical-retreat action while polling only the five arm joints.
    sequence_policy: Complete the vertical post-release retreat, then move to the next high approach through Cartesian waypoints no farther than 0.02 m apart while staying at safe high Z; never use a single direct joint-space inter-object jump.
  planning_notes:
    - For grasp and pre-close motion, choose the smallest sampled command whose aperture exceeds the supplied object extent by at least 0.002 m total clearance; do not assume command 100 is needed for a 0.030 m object.
    - Use that selected grasp/open sample's tool_center_in_frame_m for the approach, grasp, and placement-lower IK. The closed_tool_center_in_frame_m describes command 0 only and is not the pre-close alignment point.
    - Independently select the smallest release aperture sample whose aperture exceeds the supplied object extent by at least 0.008 m total clearance. Release dwell and vertical retreat must use this release sample's command and tool_center_in_frame_m; never reuse the narrower grasp sample merely because it cleared the object before closing.
    - >-
      Apply verified_controlled_point_ik to approach, descent, and lower: solve
      the selected open aperture sample's tool_center_in_frame_m within 0.0006 m,
      clamp the joint solution to effective limits, then recompute exact FK for
      that same point and reject it unless the post-clamp error is still within
      0.0006 m.
    - For tabletop pinch motions, constrain wrist_roll near plus or minus 1.5708 rad so the pinch axis is approximately horizontal, then solve the remaining position IK.
    - A MuJoCo-verified baseline uses a high approach, interpolated descent waypoints, gradual closing, and an interpolated lift while retaining the arm pose.
    - Use verified close command 1.1, not command 0; it is above the 1.041742627066557 normalized lower-bound margin implied by 0.02 rad over the 1.91986 rad actuator span.
    - >-
      Apply verified_arm_waypoint_completion_policy: omit t=0/current-pose commands;
      bound each waypoint settle by min(global deadline, waypoint start plus 3.0 s);
      require two consecutive 0.02 s polls; use the 1.0-degree five-joint criterion
      for open/pre-contact motion and observed-versus-commanded FK translation of
      the gripperframe origin within 0.01 m for lift/transport/lower.
    - Physical grasp success is contact evidence owned by the trusted oracle, never inferred from command completion.
    - Holding motion and post-release retreat require distinct explicit gripper commands; every retreat action must retain the independently selected release aperture command and its tool center, and must never fall back to either the close command or the narrower grasp-open command.
    - For placement and multi-object sequences, release only at the supported target, dwell, vertically retreat, then use high-Z Cartesian interpolation with at most 0.02 m between waypoints before the next-object approach.
    - Every sequence move item contains literal source_position_m, target_position_m, and object_extent_m fields; select aperture per move and never substitute a hardcoded default extent.
    - Clamp commands to the interior of the joint-range/actuator-ctrlrange intersection; exact converted endpoints can be reported as clipped even when the numerical overshoot is tiny.
    - Long-distance joint motion requires bounded, polled interpolation, but no reusable safe maximum joint waypoint step is currently verified; do not present an invented step as morphology evidence.

model_cameras:
  present_in_mjcf: true
  enabled_by_p0_runtime: false
  names:
    - d405_color_optical_frame
    - wrist_cam
  note: Camera geometry belongs to the upstream robot bundle, but P0 provides no camera observations.

compile_expectations:
  minimum_mujoco_version: 3.1.3
  joint_order:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  actuator_order:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  required_sites:
    - baseframe
    - gripperframe
