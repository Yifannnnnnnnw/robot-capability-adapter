schema_version: robot_capability.sdk_api_surface.v1
runtime_id: lerobot_soarm101_0_6_0
distribution: lerobot
version: 0.6.0
commit: 30da8e687a6dfc617fcd94afc367ac7071c376ce
evidence_level: source_verified

canonical_import:
  module: lerobot.robots.so_follower
  symbols:
    - SO101Follower
    - SO101FollowerConfig
  code: from lerobot.robots.so_follower import SO101Follower, SO101FollowerConfig

aliases_at_v0_6_0:
  SO101Follower: SOFollower
  SO101FollowerConfig: SOFollowerRobotConfig
  warning: Runtime class names and reprs may say SOFollower; consumers must use the canonical public aliases and must not assert the concrete __name__ is SO101Follower.

configuration:
  class: SO101FollowerConfig
  registry_type: so101_follower
  fields:
    - name: id
      type: str | null
      required: false
      default: null
      inherited_from: RobotConfig
      meaning: Distinguishes robots and selects the calibration filename.
    - name: calibration_dir
      type: pathlib.Path | null
      required: false
      default: null
      inherited_from: RobotConfig
      meaning: Overrides the directory holding calibration data.
    - name: port
      type: str
      required: true
      meaning: Serial port for the Feetech motor bus.
    - name: disable_torque_on_disconnect
      type: bool
      required: false
      default: true
      meaning: Passed to the motor bus when disconnecting.
    - name: max_relative_target
      type: float | dict[str, float] | null
      required: false
      default: null
      meaning: Optional per-command delta clamp in the active motor representation. Dictionary keys are bare motor names, without the .pos suffix, and must exactly match the motors included in that action.
    - name: cameras
      type: dict[str, CameraConfig]
      required: false
      default_factory: dict
      p0_value: {}
      meaning: Optional camera configurations. P0 deliberately configures none.
    - name: use_degrees
      type: bool
      required: false
      default: true
      p0_value: true
      meaning: Selects degrees for the five arm motors when true; selects normalized [-100, 100] range coordinates when false. It never selects radians. The gripper remains normalized [0, 100] in both modes.

motors:
  - id: 1
    name: shoulder_pan
    feature_key: shoulder_pan.pos
    role: arm
  - id: 2
    name: shoulder_lift
    feature_key: shoulder_lift.pos
    role: arm
  - id: 3
    name: elbow_flex
    feature_key: elbow_flex.pos
    role: arm
  - id: 4
    name: wrist_flex
    feature_key: wrist_flex.pos
    role: arm
  - id: 5
    name: wrist_roll
    feature_key: wrist_roll.pos
    role: arm
  - id: 6
    name: gripper
    feature_key: gripper.pos
    role: gripper

unit_profiles:
  p0_degrees:
    config: {use_degrees: true}
    shoulder_pan.pos: deg
    shoulder_lift.pos: deg
    elbow_flex.pos: deg
    wrist_flex.pos: deg
    wrist_roll.pos: deg
    gripper.pos: normalized_0_100
  normalized_body:
    config: {use_degrees: false}
    shoulder_pan.pos: normalized_minus_100_100
    shoulder_lift.pos: normalized_minus_100_100
    elbow_flex.pos: normalized_minus_100_100
    wrist_flex.pos: normalized_minus_100_100
    wrist_roll.pos: normalized_minus_100_100
    gripper.pos: normalized_0_100

properties:
  - name: observation_features
    return_type: dict[str, type | tuple]
    connected_required: false
    p0_value:
      shoulder_pan.pos: float
      shoulder_lift.pos: float
      elbow_flex.pos: float
      wrist_flex.pos: float
      wrist_roll.pos: float
      gripper.pos: float
    note: Configured camera keys and shapes are appended when cameras are present; P0 has none.
  - name: action_features
    return_type: dict[str, type]
    connected_required: false
    p0_value:
      shoulder_pan.pos: float
      shoulder_lift.pos: float
      elbow_flex.pos: float
      wrist_flex.pos: float
      wrist_roll.pos: float
      gripper.pos: float
  - name: is_connected
    return_type: bool
    connected_required: false
  - name: is_calibrated
    return_type: bool
    connected_required: false

methods:
  - name: setup_motors
    signature: "setup_motors() -> None"
    lifecycle: setup
    interactive: true
    behavior: Prompts the user to connect one motor at a time and assigns configured motor IDs.
  - name: connect
    signature: "connect(calibrate: bool = true) -> None"
    lifecycle: connect
    interactive_when_calibration_needed: true
    behavior: Connects the bus and cameras, optionally calibrates, then configures motor control parameters.
  - name: calibrate
    signature: "calibrate() -> None"
    lifecycle: calibration
    interactive: true
  - name: configure
    signature: "configure() -> None"
    lifecycle: setup
    behavior: Configures motors for position control and writes controller gains and gripper protections.
  - name: get_observation
    signature: "get_observation() -> RobotObservation"
    connected_required: true
    behavior: Synchronously reads Present_Position for all six motors and then any configured cameras; returns a flat dictionary.
  - name: send_action
    signature: "send_action(action: RobotAction) -> RobotAction"
    connected_required: true
    behavior: Selects .pos fields, strips their suffixes, optionally clips target deltas, performs one Goal_Position sync_write, and returns the position fields actually submitted.
    return_is_post_motion_observation: false
    waits_for_physical_arrival: false
    performs_trajectory_generation: false
    performs_inverse_kinematics: false
    performs_collision_checking: false
    important_nonblocking_note: Non-blocking means no wait for physical convergence. The synchronous serial read/write itself may still block for transport I/O.
  - name: disconnect
    signature: "disconnect() -> None"
    lifecycle: disconnect
    behavior: Disconnects the motor bus, optionally disabling torque, and disconnects configured cameras.

action_details:
  declared_type: RobotAction
  runtime_shape: dict[str, Any]
  recognized_fields: Keys ending in .pos.
  p0_allowed_fields:
    - shoulder_pan.pos
    - shoulder_lift.pos
    - elbow_flex.pos
    - wrist_flex.pos
    - wrist_roll.pos
    - gripper.pos
  receipt: A dictionary containing the motor .pos targets actually sent, after optional relative clipping.
  unknown_or_missing_fields: The SOFollower source does not validate a complete six-key schema. Generated code must use only declared action_features; behavior for incomplete hardware writes is not elevated to a portable contract.
  relative_clipping:
    disabled_when: max_relative_target is null
    scalar_mode: A positive float symmetrically clips each requested motor delta around its current position.
    dictionary_mode: Bare motor-name keys must exactly equal the set of requested .pos motors.
    side_effect: Enabling clipping adds a Present_Position sync_read before the Goal_Position sync_write.
