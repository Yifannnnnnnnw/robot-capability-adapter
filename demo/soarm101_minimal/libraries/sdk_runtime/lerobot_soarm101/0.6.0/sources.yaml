evidence_policy:
  documented_fact: Supported by official documentation or release metadata.
  source_verified_fact: Read directly from source at the pinned tag and commit.
  probe_verified_fact: Confirmed only after probes/probe_api.py passes in the pinned environment.
  assumption: Must be labeled and cannot be promoted to a runtime fact without evidence.

local_copy_policy:
  copied_lerobot_source: false
  copied_hardware_calibration: false
  copied_predecessor_runtime_profile: false
  note: This dossier re-expresses the public contract and links to pinned official sources; no LeRobot implementation is vendored.
