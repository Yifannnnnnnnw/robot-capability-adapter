schema_version: robot_capability.task_taxonomy.v1
taxonomy_id: soarm101_tabletop_p0
version: 1.0.0
coordinate_convention:
  frame: robot_base
  handedness: right_handed
  position_unit: m
  angle_unit: rad
  axes:
    x: forward_from_robot_base
    y: left_from_robot_base
    z: upward
  table_surface_z_m: 0.02
  p0_workspace_bounds_m:
    x: [0.22, 0.46]
    y: [-0.14, 0.14]
    z: [0.02, 0.22]
  note: Bounds are a conservative P0 task-authoring envelope and must be checked by the bridge reachability probe before a run is frozen.

observation_contract:
  mode: structured_state_no_vision
  consumer_receives:
    - natural_language_instruction
    - coordinate_convention
    - object_geometry_and_pose_fields_required_by_the_template
    - target_geometry_and_pose_fields_required_by_the_template
  consumer_never_receives:
    - mujoco_qpos_or_qvel
    - contact_forces
    - oracle_predicates_or_thresholds
    - hidden_task_metadata
  generation_receives:
    - visible_task_templates
    - required_scene_fact_paths
    - coordinate_convention_and_workspace_bounds
  generation_never_receives:
    - concrete_demo_instances
    - pilot_heldout_templates
    - oracle_definitions

families:
  reach:
    description: Move the end effector to a supplied Cartesian target without manipulating an object.
  push:
    description: Maintain table contact while displacing an object into a planar target region.
  grasp_hold:
    description: Establish and maintain a stable gripper-object grasp.
  lift:
    description: Grasp an object and raise it by a requested vertical displacement.
  pick_place:
    description: Pick, transport, release, and settle an object at or inside a target.
  stack:
    description: Place one object stably on another and release it.
  composite:
    description: Complete two or more ordered manipulation goals.

levels:
  atomic: One primary terminal predicate, even if several motor actions are necessary.
  composite: Two or more ordered object-level terminal predicates.

skill_tokens:
  - move_end_effector
  - approach_object
  - push_object
  - close_gripper
  - maintain_grasp
  - lift_object
  - transport_object
  - lower_object
  - open_gripper
  - settle_object
  - repeat_for_next_object

goal_predicates:
  - ee_position_near_target
  - object_xy_in_region
  - object_grasped
  - grasp_stable_for_duration
  - object_height_delta_near_target
  - object_pose_in_region
  - object_contained_by_receptacle
  - object_released
  - object_static
  - object_supported_by_object
  - ordered_subgoals_complete
  - objects_in_matching_receptacles

object_affordances:
  - pose_target
  - pushable_prismatic
  - pushable_round
  - pinch_graspable_prismatic
  - pinch_graspable_round
  - planar_support
  - shallow_receptacle
  - concave_receptacle
  - stackable_top
  - stackable_base

spatial_relations:
  - cartesian_target
  - planar_forward
  - planar_lateral
  - above_initial
  - on_planar_region
  - inside_tray
  - inside_bowl
  - on_top_of
  - ordered_same_receptacle
  - matching_receptacles

similarity:
  schema_version: robot_capability.task_similarity.v1
  weights:
    skill_sequence_edit_distance: 0.35
    goal_predicate_set_distance: 0.25
    object_affordance_set_distance: 0.15
    spatial_receptacle_set_distance: 0.15
    horizon_precision_distance: 0.10
  components:
    skill_sequence_edit_distance: Normalized Levenshtein distance over skill_tokens; denominator is the longer sequence length.
    goal_predicate_set_distance: Jaccard distance over goal_predicates.
    object_affordance_set_distance: Jaccard distance over object_affordances.
    spatial_receptacle_set_distance: Jaccard distance over spatial_relations.
    horizon_precision_distance: Mean of normalized ordinal distances for horizon_class and precision_class, with short/low=0, medium=1, long/high=2.
  grouping_rule: A similarity_group contains only one semantic template and all of its paraphrases and future seeded realizations; a group cannot cross the visible/held-out boundary.
  embedding_policy: Text embeddings may flag likely paraphrases for review but never decide the split.

split_policy:
  policy_id: soarm101_p0_cluster_stratified_3_to_1_v1
  visible_count: 9
  pilot_heldout_count: 3
  split_unit: similarity_group
  leakage_rule: No task template, paraphrase, or seeded realization may occur on both sides of the split.
  reporting_term: pilot-held-out
