[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoadapter2-demo3"
version = "0.1.0"
description = "Self-contained AutoAdapter 2.0 Direct-MuJoCo experiment workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mujoco==3.3.6",
  "numpy==2.4.6",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.autoadapter2.runtime]
python = "3.11"
system_tools = ["ffmpeg", "ffprobe"]
