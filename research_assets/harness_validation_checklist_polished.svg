<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230">
  <defs>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtle { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #64748b; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #334155; letter-spacing: 0.2px; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #1f2937; }
      .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 14px; fill: #334155; }
      .ok { fill: #16a34a; font-weight: 700; }
      .metric { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .metricLabel { font-family: Arial, Helvetica, sans-serif; font-size: 12px; fill: #64748b; }
      .pass { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #166534; }
    </style>
  </defs>

  <rect x="18" y="16" width="784" height="198" rx="22" fill="#ffffff" filter="url(#softShadow)"/>
  <rect x="18" y="16" width="784" height="198" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="46" y="52" class="title">Harness Validation Checklist</text>
  <text x="46" y="74" class="subtle">Reach capability validation record</text>
  <rect x="625" y="35" width="142" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="696" y="55" text-anchor="middle" class="mono">reach_target</text>

  <line x1="288" y1="92" x2="288" y2="188" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="542" y1="92" x2="542" y2="188" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="46" y="108" class="head">Source Check</text>
  <text x="316" y="108" class="head">MuJoCo Trials</text>
  <text x="570" y="108" class="head">Verdict</text>

  <text x="46" y="137" class="text"><tspan class="ok">✓</tspan> no private leak</text>
  <text x="46" y="164" class="text"><tspan class="ok">✓</tspan> import ok</text>
  <text x="46" y="191" class="text"><tspan class="ok">✓</tspan> build() found</text>

  <text x="316" y="137" class="text"><tspan class="ok">✓</tspan> rollout video</text>
  <text x="316" y="164" class="text"><tspan class="ok">✓</tspan> endpoint measured</text>

  <rect x="316" y="174" width="178" height="34" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="330" y="196" class="metric">0.002 m</text>
  <text x="430" y="196" class="metricLabel">distance</text>

  <rect x="570" y="122" width="170" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="586" y="148" class="mono">threshold: 0.020 m</text>

  <rect x="570" y="174" width="112" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="592" cy="191" r="7" fill="#16a34a"/>
  <text x="626" y="198" text-anchor="middle" class="pass">PASS</text>
</svg>
