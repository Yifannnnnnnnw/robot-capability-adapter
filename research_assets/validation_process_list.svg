<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #111827; }
      .step { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #1f2937; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 14px; fill: #64748b; }
      .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 14px; fill: #334155; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .pass { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; fill: #166534; }
    </style>
  </defs>

  <rect x="0" y="0" width="620" height="320" fill="#ffffff"/>
  <text x="34" y="38" class="title">Trusted Harness Validation</text>

  <line x1="52" y1="72" x2="52" y2="258" stroke="#cbd5e1" stroke-width="3"/>

  <circle cx="52" cy="82" r="15" fill="#2563eb"/>
  <text x="52" y="88" text-anchor="middle" class="num">1</text>
  <text x="84" y="78" class="step">Audit submitted driver.py</text>
  <text x="84" y="100" class="detail">source boundary + capability request ABI</text>

  <circle cx="52" cy="132" r="15" fill="#2563eb"/>
  <text x="52" y="138" text-anchor="middle" class="num">2</text>
  <text x="84" y="128" class="step">Load sealed validation case</text>
  <text x="84" y="150" class="detail">private scene, reset, binding, criterion</text>

  <circle cx="52" cy="182" r="15" fill="#2563eb"/>
  <text x="52" y="188" text-anchor="middle" class="num">3</text>
  <text x="84" y="178" class="step">Run isolated MuJoCo worker</text>
  <text x="84" y="200" class="detail">invoke capability with public request and record rollout video</text>

  <circle cx="52" cy="232" r="15" fill="#2563eb"/>
  <text x="52" y="238" text-anchor="middle" class="num">4</text>
  <text x="84" y="228" class="step">Measure trusted evidence</text>
  <text x="84" y="250" class="detail">endpoint error, guards, contact integrity, video completeness</text>

  <circle cx="52" cy="282" r="15" fill="#16a34a"/>
  <text x="52" y="288" text-anchor="middle" class="num">5</text>
  <text x="84" y="278" class="step">Aggregate verdict</text>
  <text x="84" y="300" class="mono">endpoint error 0.002 m &lt; threshold 0.020 m</text>

  <rect x="486" y="264" width="92" height="34" rx="17" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <circle cx="507" cy="281" r="7" fill="#16a34a"/>
  <text x="545" y="289" text-anchor="middle" class="pass">PASS</text>
</svg>
