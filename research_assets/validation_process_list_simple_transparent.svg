<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 700; fill: #111827; }
      .step { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #1f2937; }
      .detail { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #64748b; }
      .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 13px; fill: #334155; }
      .pass { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #166534; }
    </style>
  </defs>

  <text x="24" y="34" class="title">Trusted Harness Validation</text>
  <line x1="42" y1="62" x2="42" y2="176" stroke="#cbd5e1" stroke-width="3"/>

  <circle cx="42" cy="68" r="8" fill="#2563eb"/>
  <text x="66" y="73" class="step">Audit driver.py</text>
  <text x="220" y="73" class="detail">source boundary + request ABI</text>

  <circle cx="42" cy="104" r="8" fill="#2563eb"/>
  <text x="66" y="109" class="step">Run sealed MuJoCo case</text>
  <text x="270" y="109" class="detail">private reset, public request</text>

  <circle cx="42" cy="140" r="8" fill="#2563eb"/>
  <text x="66" y="145" class="step">Measure evidence</text>
  <text x="220" y="145" class="detail">endpoint error, guards, video</text>

  <circle cx="42" cy="176" r="8" fill="#16a34a"/>
  <text x="66" y="181" class="step">Aggregate verdict</text>
  <text x="220" y="181" class="mono">0.002 m &lt; 0.020 m</text>

  <rect x="402" y="157" width="92" height="30" rx="15" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <circle cx="423" cy="172" r="6" fill="#16a34a"/>
  <text x="460" y="179" text-anchor="middle" class="pass">PASS</text>
</svg>
